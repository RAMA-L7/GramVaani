[project]
name = "gramvaani-sandbox-backend"
version = "0.1.0"
description = "Simulated GramVaani sandbox backend - experimental, no government integration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
